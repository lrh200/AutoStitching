[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autostitch-py"
version = "0.1.0"
description = "Python rewrite of AutoStitching topology-guided planar mosaicking pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
]

[project.scripts]
autostitch-py = "autostitch_py.cli:main"
